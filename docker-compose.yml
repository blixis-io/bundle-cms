services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_dev_only
      POSTGRES_DB: cms
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - cms_dev_data:/var/lib/postgresql
volumes:
  cms_dev_data:
